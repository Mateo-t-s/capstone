<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <form>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
        <label for="LastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
        
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br>

        <p>Are you over the age of 18?</p>
        <input type="radio" id="ageYes" name="age" value="yes" required>
        <label for="ageYes">Yes</label>
        <input type="radio" id="ageNo" name="age" value="no" required>
        <label for="ageNo">No</label>

        <br><br>

        <label for="paymentMethod">Do you have a Credit Card or PayPal?</label>
        <br><br>
        <select id="paymentMethod" name="paymentMethod" required>
            <option value="credit">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select>

        <br><br>    

        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
